name: domarket

on:
  schedule:
    - cron: "0 6 * * 1"   # lunes 06:00 UTC (07:00 en invierno, 08:00 en verano, hora de Madrid)
  workflow_dispatch:       # botón "Run workflow" para lanzarlo a mano
    inputs:
      demo:
        description: "Enviar correo de EJEMPLO con datos ficticios"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar y enviar el resumen
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          DEMO: ${{ inputs.demo }}
        run: |
          if [ "$DEMO" = "true" ]; then
            python -m src.main --demo --send
          else
            python -m src.main --send
          fi