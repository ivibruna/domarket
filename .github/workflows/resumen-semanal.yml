name: resumen-semanal

on:
  schedule:
    - cron: "17 5 * * 1"   # lunes 05:17 UTC (07:17 en Madrid en verano, 06:17 en invierno)
  workflow_dispatch:       # botón "Run workflow" para lanzarlo a mano
    inputs:
      demo:
        description: "Enviar correo de EJEMPLO con datos ficticios"
        type: boolean
        default: false

permissions:
  contents: read

env:
  LLAMACPP_TAG: "b11081"  # si esta versión deja de estar disponible, cambia el número por una reciente
  MODEL_URL: "https://huggingface.co/unsloth/gemma-4-12b-it-GGUF/resolve/main/gemma-4-12b-it-UD-Q4_K_XL.gguf"  # 7,4 GB; solo cabe en un runner de repo público (16 GB de RAM)

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Comprobar feeds de titulares
        run: python -m src.news

      - name: Instalar llama.cpp
        run: |
          mkdir -p llama && cd llama
          # Camino rápido: la versión fijada. Si ya no existe o no tiene el binario de Ubuntu,
          # se cae a la última versión disponible que sí lo tenga, para no depender de un
          # número de versión concreto que algún día dejará de existir.
          if ! gh release download "$LLAMACPP_TAG" --repo ggml-org/llama.cpp --pattern '*ubuntu-x64.tar.gz' 2>/tmp/dl.log; then
            echo "Aviso: $LLAMACPP_TAG no disponible, busco la última versión con binario de Ubuntu"
            cat /tmp/dl.log
            TAG=$(gh api "repos/ggml-org/llama.cpp/releases?per_page=30" --jq \
              '[.[] | select(any(.assets[]; .name | test("^llama-.*-bin-ubuntu-x64\\.(tar\\.gz|zip)$")))][0].tag_name')
            test -n "$TAG"
            echo "Uso $TAG en su lugar"
            gh release download "$TAG" --repo ggml-org/llama.cpp --pattern '*ubuntu-x64.tar.gz'
          fi
          tar xzf *.tar.gz
          SERVER=$(find "$PWD" -name llama-server -type f | head -1)
          test -n "$SERVER"
          echo "LLAMA_SERVER=$SERVER" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(dirname "$SERVER")" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Descargar el modelo (Gemma 4 E4B)
        run: curl -L --fail --retry 5 --retry-delay 10 -o model.gguf "$MODEL_URL"

      - name: Arrancar llama-server
        run: |
          nohup "$LLAMA_SERVER" -m model.gguf --jinja -c 6144 -t "$(nproc)" \
            --host 127.0.0.1 --port 8080 > llama.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:8080/health > /dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8080/health

      - name: Generar y enviar el resumen
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          DEMO: ${{ inputs.demo }}
        run: |
          if [ "$DEMO" = "true" ]; then
            python -m src.main --demo --ai --send
          else
            python -m src.main --ai --send
          fi

      - name: Registro de llama-server (si algo falla)
        if: failure()
        run: tail -n 60 llama.log || true

      - name: Avisar por correo si algo ha fallado
        if: failure()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python -m src.notify || true
